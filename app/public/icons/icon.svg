<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Golden Border -->
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85" />

  <!-- Corner Islamic Stars -->
  <g fill="url(#goldGrad)">
    <polygon points="56,56 64,44 72,56 84,64 72,72 64,84 56,72 44,64" />
    <polygon points="456,56 464,44 472,56 484,64 472,72 464,84 456,72 444,64" />
    <polygon points="56,456 64,444 72,456 84,464 72,472 64,484 56,472 44,464" />
    <polygon points="456,456 464,444 472,456 484,464 472,472 464,484 456,472 444,464" />
  </g>

  <!-- Central Medallion Circle -->
  <circle cx="256" cy="240" r="150" fill="#04392B" stroke="url(#goldGrad)" stroke-width="8" />
  <circle cx="256" cy="240" r="138" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />

  <!-- Calligraphy "م" in Gold -->
  <text x="256" y="295" font-family="'Amiri', 'Traditional Arabic', serif" font-size="180" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">م</text>

  <!-- Subtitle AL-MIFTAH -->
  <text x="256" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" letter-spacing="6" fill="#FCD34D" text-anchor="middle">AL-MIFTAH</text>
  <text x="256" y="475" font-family="'Amiri', serif" font-size="24" font-weight="bold" fill="#F59E0B" text-anchor="middle" opacity="0.85">المفتاح في النحو والصرف</text>
</svg>